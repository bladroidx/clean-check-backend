name: deploy-staging

# Deploys `main` to staging once CI has passed on it. Coolify stays private: this job can only SSH
# to the VM with a key that authorized_keys pins to deploy/coolify-deploy-staging.sh, which calls
# Coolify on localhost, waits for the deployment's outcome and then for the stack to be healthy.
# There is no public URL to smoke-test: the api is reachable only on the VM's internal network.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A push to main that passed CI -- never a PR run, never a failed one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Deploy through the VM's forced command
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ vars.STAGING_SSH_TARGET }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_TARGET"

