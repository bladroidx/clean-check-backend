name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run boundaries
      - run: npm test
      # Real Postgres (docker): migrations, retention partitions, and the deep path end to end.
      - run: npm run test:integration

  # Coolify builds on the ARM host itself; this catches a broken image before it gets there.
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t imei-check:ci .
      - run: docker build -f Dockerfile.migrate -t imei-check-migrate:ci .
