# Development stack. No supplier credentials here, so deep sections come back
# unavailable(provider_not_configured) and nothing is ever spent. For a production-like stack with a
# fake imei24 (tools/fake-imei24) and the check-this-phone backend in front, see
# ../check-this-phone/check-this-phone-backend/local-stack/.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: imei
      POSTGRES_PASSWORD: imei
      POSTGRES_DB: imei_check
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imei -d imei_check']
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations run as their own step, never on app boot: N replicas racing dbmate is a bad
  # afternoon.
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://imei:imei@postgres:5432/imei_check?sslmode=disable
    # Read-only, and no schema dump: `dbmate up` would otherwise rewrite db/schema.sql in the repo.
    volumes: ['./db:/db:ro']
    command: ['--wait', '--no-dump-schema', 'up']

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: &app_env
      NODE_ENV: development
      LOG_LEVEL: info
      # Development value only. Production reads this from the platform secret store.
      SERVER_PEPPER: dev-pepper-not-for-production-0123456789
      DATABASE_URL: postgres://imei:imei@postgres:5432/imei_check?sslmode=disable
      # Development value only (ADR-0007). Required once DATABASE_URL is set, or the api refuses to
      # boot. Production reads it from the secret store, apart from the database backups.
      IMEI_ENCRYPTION_KEYS: '1:ZGV2LW9ubHktbm90LWZvci1wcm9kdWN0aW9uLWtleSE='
      # Where an async supplier POSTs its answer back to. Inside compose that is the api service.
      PUBLIC_BASE_URL: http://api:3000
    ports: ['3000:3000']

  # A separate process, not a thread in the API.
  #
  # A poll storm or a slow webhook receiver must not consume the connection pool that paid checks
  # need; the two have very different latency requirements and should fail independently. Every
  # job claims its rows with FOR UPDATE SKIP LOCKED, so scaling this to N replicas is safe and is
  # the intended way to scale it.
  worker:
    build: .
    command: ['node', 'apps/worker/dist/main.js']
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: *app_env

volumes:
  pgdata:
