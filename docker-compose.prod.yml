# Production stack for Coolify ("Docker Compose" build pack) or any single Docker host. Unlike
# docker-compose.yml there is no secret in this file and nothing is published to the host: Postgres
# is reachable only on the compose network.
#
# The api is private. Its one caller (the trustmob-check backend, on the same host) reaches it as
# http://imei-check:3000 over the external network named by IMEI_INTERNAL_NETWORK, which only the
# two api containers join -- never either database. Create it once per environment on the host:
#   docker network create imei-check-staging-internal
# Give the `api` service no domain in Coolify, so nothing routes to it from the internet.
#
# Every `${VAR:?}` must be set in the platform's environment, or the deploy fails before anything
# starts. SERVER_PEPPER and IMEI_ENCRYPTION_KEYS must also be kept somewhere off this host: losing
# the keyring makes every stored IMEI unrecoverable, and a new pepper orphans the whole cache.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: imei
      # Hex only (`openssl rand -hex 32`): it is interpolated into DATABASE_URL unescaped.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: imei_check
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imei -d imei_check']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Migrations run as their own step, never on app boot: N replicas racing dbmate is a bad
  # afternoon.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://imei:${POSTGRES_PASSWORD:?}@postgres:5432/imei_check?sslmode=disable
    restart: 'no'

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: &app_env
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_PEPPER: ${SERVER_PEPPER:?}
      DATABASE_URL: postgres://imei:${POSTGRES_PASSWORD:?}@postgres:5432/imei_check?sslmode=disable
      # `1:<base64 of 32 random bytes>` (ADR-0007). The api refuses to boot without it.
      IMEI_ENCRYPTION_KEYS: ${IMEI_ENCRYPTION_KEYS:?}
      # Where an async supplier POSTs its answer back to. Empty while the api is private: no
      # feedback_url is sent and the worker's poll loop settles standard orders instead.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Both empty = free tier only; one without the other refuses to boot.
      IMEI24_BASE_URL: ${IMEI24_BASE_URL:-https://pro.imei24.com}
      IMEI24_USERNAME: ${IMEI24_USERNAME:-}
      IMEI24_API_KEY: ${IMEI24_API_KEY:-}
      IMEI24_DAILY_SPEND_USD: ${IMEI24_DAILY_SPEND_USD:-10}
      DEEP_CHECK_WAIT_MS: ${DEEP_CHECK_WAIT_MS:-10000}
    expose: ['3000']
    networks:
      default:
      internal:
        aliases: [imei-check]
    restart: unless-stopped

  # A separate process, not a thread in the API: a poll storm must not consume the connection
  # pool that paid checks need. Rows are claimed with FOR UPDATE SKIP LOCKED, so N replicas is safe.
  worker:
    build: .
    command: ['node', 'apps/worker/dist/main.js']
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment: *app_env
    # The image's HEALTHCHECK probes the api's port, which the worker does not serve. Healthy means
    # a poll tick succeeded in the last 5 minutes (apps/worker/src/heartbeat.ts).
    healthcheck:
      test: ['CMD', 'node', 'apps/worker/dist/healthcheck.js']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 2
    restart: unless-stopped

networks:
  internal:
    external: true
    name: ${IMEI_INTERNAL_NETWORK:?}

volumes:
  pgdata:
