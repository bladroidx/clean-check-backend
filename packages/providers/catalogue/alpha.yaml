# Supplier A — legacy DHRU Fusion.
#
# Service IDs are the supplier's, and they are the ONLY routing key. The display names below are
# seller-authored marketing copy, recorded so an operator can find the service in the supplier's
# panel and for no other purpose. Never route on them (ADR-0002).
#
# cost_usd is what they charge us; credits is what we charge the tenant. Both are checked in so a
# margin change is a reviewable diff rather than a surprise in next month's invoice. The nightly
# drift job compares cost_usd against `imeiservicelist` and disables a service that has repriced.
provider_id: alpha
services:
  - service_id: "12"
    display_name: "GSMA BLACKLIST CHECK (INSTANT)"
    capabilities: [blacklist.gsma]
    fields:
      - blacklist.status
      - blacklist.reported_by
      - blacklist.reported_at
    lexicon: blacklist
    cost_usd: 0.12
    credits: 3
    async: false
    timeout_ms: 15000
    applies_to_tac_prefixes: ["*"]
    enabled: true

  - service_id: "30"
    display_name: "APPLE FULL INFO + FMI + SIMLOCK"
    capabilities:
      - lock.activation
      - lock.carrier
      - lock.mdm
      - warranty.purchase_date
      - network.sold_by
      - identity.model
    fields:
      - lock.activation.status
      - lock.carrier.status
      - lock.carrier.network
      - lock.mdm.status
      - warranty.purchase_date
      - network.sold_by
      - identity.manufacturer
      - identity.model
    lexicon: apple-basic
    cost_usd: 0.45
    credits: 8
    async: false
    timeout_ms: 25000
    # Apple TACs only. A GSX-family service that claims to cover Samsung is a catalogue bug that
    # bills the tenant and returns a rejection.
    applies_to_tac_prefixes: ["35310411", "35847191", "01332300", "35326907"]
    enabled: true
